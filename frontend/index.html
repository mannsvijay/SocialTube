    <!-- Primary -->
    <title>SocialTube — Share &amp; Discover Videos</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="description"
          content="Share your creativity with the world. Discover amazing videos from creators everywhere." />

    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="SocialTube" />
    <meta property="og:description" content="Share and discover amazing videos" />

    <meta name="twitter:title"       content="SocialTube" />
    <meta name="twitter:description" content="Share and discover amazing videos" />
